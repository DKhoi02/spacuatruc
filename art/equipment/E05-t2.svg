<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 230">
  <title>E05 Đèn và tinh dầu thơm phòng – Tốt (máy khuếch tán + nến)</title>
  <defs>
    <radialGradient id="e05t2-glow-grad">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffe9a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="glow">
    <circle cx="40" cy="80" r="46" fill="url(#e05t2-glow-grad)"/>
  </g>
  <g id="mist" fill="none" stroke="#cfe3e6" stroke-width="4" stroke-linecap="round">
    <path class="mist-1" d="M102 66 C 94 54 110 48 102 32"/>
    <path class="mist-2" d="M114 62 C 108 50 122 42 116 26"/>
  </g>
  <g id="stand" stroke="#8a5f4b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- bàn gỗ có kệ dưới -->
    <path d="M20 136 V224 M120 136 V224" fill="none" stroke="#c49a70" stroke-width="8"/>
    <path d="M20 136 V224 M120 136 V224" fill="none" stroke-width="2"/>
    <rect x="12" y="180" width="116" height="10" rx="4" fill="#d8b48c" stroke-width="3"/>
    <rect x="30" y="166" width="34" height="14" rx="6" fill="#a9c9b3" stroke-width="3"/>
    <rect x="66" y="166" width="34" height="14" rx="6" fill="#fffaf3" stroke-width="3"/>
    <rect x="6" y="122" width="128" height="16" rx="6" fill="#d8b48c"/>
    <path d="M14 130 H126" stroke="#a9c9b3" stroke-width="3" fill="none"/>
    <!-- đèn -->
    <path d="M28 122 H52 L48 110 H32 Z" fill="#fffaf3"/>
    <path d="M40 110 V98" fill="none"/>
    <path d="M18 100 L28 58 H52 L62 100 Z" fill="#a9c9b3"/>
    <path d="M32 62 L28 96 M40 62 V96 M48 62 L52 96" stroke="#8fb39a" stroke-width="2" fill="none"/>
    <!-- máy khuếch tán gốm -->
    <path d="M86 122 C 82 98 90 80 108 74 C 126 80 134 98 130 122 Z" fill="#fffaf3"/>
    <path d="M86 106 C 100 112 116 112 130 106" stroke="#8fb39a" stroke-width="6" fill="none"/>
    <ellipse cx="108" cy="74" rx="8" ry="3" fill="#a9c9b3" stroke-width="2"/>
    <!-- nến -->
    <rect x="58" y="106" width="12" height="16" rx="2" fill="#fffaf3" stroke-width="3"/>
    <path d="M64 100 C 60 96 64 92 64 90 C 64 92 68 96 64 100 Z" fill="#e8b46a" stroke-width="2"/>
    <rect x="70" y="112" width="10" height="10" rx="2" fill="#f0c6b8" stroke-width="3"/>
    <path d="M75 108 C 72 105 75 102 75 100 C 75 102 78 105 75 108 Z" fill="#e8b46a" stroke-width="2"/>
  </g>
</svg>
