<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 84">
  <title>E07 Bộ đá gua sha – Cao cấp (thạch anh hồng viền vàng, hộp gỗ)</title>
  <g id="guasha-set" stroke="#8a5f4b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- nắp hộp gỗ mở, lót nhung -->
    <path d="M8 60 L18 4 H132 L142 60 Z" fill="#9a6a4b"/>
    <path d="M23 10 H127 L135 54 H15 Z" fill="#5f8a70" stroke-width="2"/>
    <path d="M27 16 H123" stroke="#d4a85a" stroke-width="2" fill="none"/>
    <circle cx="137" cy="40" r="3" fill="#d4a85a" stroke-width="2"/>
    <!-- gua sha hình cánh thạch anh hồng viền vàng -->
    <path d="M12 62 C 10 38 30 22 52 24 C 68 26 74 40 66 50 C 54 44 40 46 34 62 Z" fill="#f0c6b8"/>
    <path d="M17 58 C 17 42 32 29 52 29" stroke="#d4a85a" stroke-width="2.5" fill="none"/>
    <path d="M30 40 C 36 35 42 33 48 33" stroke="#fffaf3" stroke-width="3" fill="none"/>
    <!-- cây lăn thạch anh hồng tay vàng -->
    <path d="M94 56 L124 20" stroke="#d4a85a" stroke-width="6" fill="none"/>
    <path d="M94 56 L124 20" stroke-width="2" fill="none"/>
    <rect x="78" y="48" width="30" height="15" rx="7.5" fill="#f0c6b8" transform="rotate(-50 93 55)"/>
    <rect x="116" y="12" width="18" height="10" rx="5" fill="#f0c6b8" stroke-width="3" transform="rotate(-50 125 17)"/>
    <path d="M87 58 L97 47" stroke="#fffaf3" stroke-width="2" fill="none"/>
    <!-- thân hộp gỗ, khoá vàng -->
    <rect x="4" y="60" width="142" height="18" rx="6" fill="#9a6a4b"/>
    <path d="M8 64 H142" stroke="#d4a85a" stroke-width="2" fill="none"/>
    <rect x="66" y="62" width="18" height="13" rx="3" fill="#d4a85a" stroke-width="3"/>
    <circle cx="75" cy="68.5" r="2" fill="#8a5f4b" stroke="none"/>
  </g>
</svg>
