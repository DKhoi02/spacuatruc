<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 230">
  <title>E05 Đèn và tinh dầu thơm phòng</title>
  <defs>
    <radialGradient id="e05-glow-grad">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffe9a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="glow">
    <circle cx="44" cy="74" r="44" fill="url(#e05-glow-grad)"/>
  </g>
  <g id="mist" fill="none" stroke="#cfe3e6" stroke-width="4" stroke-linecap="round">
    <path class="mist-1" d="M100 74 C 92 62 108 56 100 40"/>
    <path class="mist-2" d="M112 70 C 106 58 120 50 114 34"/>
  </g>
  <g id="stand" stroke="#8a5f4b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M24 136 L16 224 M116 136 L124 224 M22 184 H118" fill="none"/>
    <rect x="6" y="122" width="128" height="18" rx="6" fill="#c49a70"/>
    <!-- đèn -->
    <path d="M26 122 H62 L58 112 H30 Z" fill="#d8b48c"/>
    <path d="M44 112 V96" fill="none"/>
    <path d="M22 98 L32 56 H56 L66 98 Z" fill="#fffaf3"/>
    <path d="M30 80 H58" stroke="#f0c6b8" stroke-width="3" fill="none"/>
    <!-- máy khuếch tán tinh dầu -->
    <path d="M86 122 C 82 100 90 84 106 80 C 122 84 130 100 126 122 Z" fill="#a9c9b3"/>
    <path d="M90 108 C 100 112 112 112 122 108" stroke="#fffaf3" stroke-width="3" fill="none"/>
    <ellipse cx="106" cy="80" rx="7" ry="3" fill="#4f7a62" stroke-width="2"/>
    <!-- lọ tinh dầu nhỏ -->
    <rect x="68" y="104" width="14" height="18" rx="3" fill="#e8b46a" stroke-width="3"/>
    <rect x="71" y="97" width="8" height="7" rx="2" fill="#8a5f4b" stroke-width="2"/>
  </g>
</svg>
